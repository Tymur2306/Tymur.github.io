<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Діана Гаркуша | Офіційний сайт</title>
    <meta name="description" content="Офіційний сайт Діани Гаркуші — фотомодель та акторка.">
    
    <!-- Шрифти Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230c0c0e'/><text x='50%' y='65%' font-family='Georgia, serif' font-size='48' font-weight='bold' fill='%23e2b714' text-anchor='middle'>DG</text></svg>">

    <!-- CSS СТИЛІ -->
    <style>
        :root {
            --bg-color: #0c0c0e;
            --card-bg: rgba(255, 255, 255, 0.04);
            --accent-color: #e2b714;
            --text-main: #f4f4f6;
            --text-muted: #a0a0ab;
            --border-color: rgba(255, 255, 255, 0.08);
            --font-title: 'Cormorant Garamond', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- СЯЙВО НА ФОНІ --- */
        .glow-bg {
            position: fixed;
            top: -5%;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(226, 183, 20, 0.18) 0%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            100% { transform: translateX(-50%) scale(1.3); opacity: 0.8; }
        }

        /* --- ШАПКА --- */
        header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            z-index: 1000;
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span { color: var(--accent-color); }

        /* Навігація ПК */
        .desktop-nav {
            display: none;
            gap: 28px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 400;
            transition: color 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-color);
        }

        /* Кнопка-гамбургер (три смужки) */
        .hamburger-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1001;
        }

        .hamburger-btn span {
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }

        /* Анімація перетворення гамбургера на хрестик */
        .hamburger-btn.open span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
            background-color: var(--accent-color);
        }

        .hamburger-btn.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.open span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
            background-color: var(--accent-color);
        }

        /* Висувне мобільне меню */
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(12, 12, 14, 0.96);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 999;
        }

        .mobile-menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .mobile-menu-overlay .nav-link {
            font-family: var(--font-title);
            font-size: 2rem;
            color: var(--text-main);
        }

        .mobile-menu-overlay .nav-link.active {
            color: var(--accent-color);
        }

        /* --- ОСНОВНИЙ КОНТЕЙНЕР --- */
        .container {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            padding: 20px 24px;
        }

        /* --- HERO SECTION --- */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px 0;
        }

        /* Рамка для фотографії */
        .avatar-frame {
            width: 210px;
            height: 280px;
            border-radius: 110px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            flex-shrink: 0;
            position: relative;
            background: #141418;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1c1c24, #101014);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .badge {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .main-title {
            font-family: var(--font-title);
            font-size: clamp(3.2rem, 10vw, 5.2rem);
            font-weight: 400;
            line-height: 1.05;
            margin-bottom: 16px;
        }

        .hero-desc {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 28px;
            font-size: clamp(1.1rem, 4vw, 1.35rem);
            line-height: 1.6;
        }

        .tags-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tag {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        /* --- АДАПТИВНІСТЬ ДЛЯ ПК (min-width: 768px) --- */
        @media (min-width: 768px) {
            .desktop-nav { display: flex; }
            .hamburger-btn { display: none; }
            .mobile-menu-overlay { display: none; }

            .hero-section {
                flex-direction: row;
                text-align: left;
                justify-content: center;
                gap: 70px;
                padding: 60px 0;
            }

            .avatar-frame {
                width: 300px;
                height: 400px;
                border-radius: 150px;
                margin-bottom: 0;
            }

            .hero-desc { 
                margin: 0 0 28px 0; 
            }

            .tags-container { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <!-- ФОНОВЕ СЯЙВО -->
    <div class="glow-bg"></div>

    <!-- ШАПКА -->
    <header>
        <a href="index.html" class="logo">Діана <span>Гаркуша</span></a>
        
        <!-- Меню для комп'ютера -->
        <nav class="desktop-nav">
            <a href="index.html" class="nav-link active">Головна</a>
            <a href="about.html" class="nav-link">Про мене</a>
            <a href="services.html" class="nav-link">Послуги</a>
            <a href="contacts.html" class="nav-link">Контакти</a>
        </nav>

        <!-- Кнопка «3 смужки» для телефона -->
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Відкрити меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Висувне мобільне меню -->
    <div class="mobile-menu-overlay" id="mobileMenu">
        <a href="index.html" class="nav-link active">Головна</a>
        <a href="about.html" class="nav-link">Про мене</a>
        <a href="services.html" class="nav-link">Послуги</a>
        <a href="contacts.html" class="nav-link">Контакти</a>
    </div>

    <!-- ОСНОВНИЙ КОНТЕНТ -->
    <div class="container">
        <section class="hero-section">
            <div class="avatar-frame" id="avatarFrame">
                <img id="avatarImg" src="Діана 2.jpg" alt="Діана Гаркуша" class="avatar-img" onerror="showPlaceholder()">
            </div>
            
            <div class="hero-info">
                <p class="badge">Model & Actress • 17 y.o.</p>
                <h1 class="main-title">Діана Гаркуша</h1>
                <p class="hero-desc">
                    Професійна фотомодель та акторка з досвідом зйомок у серіалах та рекламних кампейнах провідних брендів одягу.
                </p>

                <div class="tags-container">
                    <span class="tag">Fashion Model</span>
                    <span class="tag">Акторка</span>
                    <span class="tag">Commercial / Reels</span>
                </div>
            </div>
        </section>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Робота мобільного меню
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('open');
            mobileMenu.classList.toggle('active');
            
            if (mobileMenu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        });

        // Показ заглушки, якщо фото не завантажилося або шлях вказано невірно
        function showPlaceholder() {
            const frame = document.getElementById('avatarFrame');
            frame.innerHTML = '<div class="avatar-placeholder"><span>[ Фото Діани ]</span></div>';
        }
    </script>
</body>
</html>
