<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENSO / Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ФІКСОВАНИЙ ЗАДНІЙ ФОН -->
  <img src="fon.png" alt="Фон" class="global-bg">

  <!-- ШАПКА -->
  <header class="header">
    <div class="header__container">
      <a href="#hero" class="logo">ENSO</a>

      <button class="burger" id="burger-btn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="nav-menu">
        <ul class="nav__list">
          <li><a href="#hero" class="nav__link" data-i18n="nav_works">WORKS</a></li>
          <li><a href="#about" class="nav__link" data-i18n="nav_about">ABOUT</a></li>
          <li><a href="#works" class="nav__link" data-i18n="nav_PORTFOLIO">PORTFOLIO</a></li>
          <li><a href="#contacts" class="nav__link" data-i18n="nav_contacts">CONTACT</a></li>
        </ul>

        <!-- ЖАБА З ТІННЮ ДЛЯ МОБІЛЬНОГО БУРГЕР-МЕНЮ -->
        <div class="mobile-menu-footer">
          <div class="mobile-frog-shadow"></div>
          <img src="frog.png" alt="Жаба" class="mobile-artwork-frog">
        </div>
      </nav>

      <!-- ПЕРЕМИКАЧ МОВ У ПРАВОМУ ВЕРХНЬОМУ КУТКУ -->
      <div class="lang-switch">
        <a href="#" id="lang-uk">UK</a> / <a href="#" id="lang-en" class="active">EN</a>
      </div>
    </div>
  </header>

  <!-- СКРОЛ-КОНТЕЙНЕР -->
  <main class="scroll-container">
    
    <!-- 1. ГОЛОВНА -->
    <section id="hero" class="screen-section hero-section">
      <!-- ВЕРТИКАЛЬНИЙ ТЕКСТ З ПЕЧАТКОЮ ЗЛІВА -->
      <div class="vertical-text">
        <span>静けさの中に、異質な美しきを。</span>
        <div class="seal-icon">窩</div>
      </div>

      <img src="girl-frog.png" alt="Дівчина" class="artwork-girl">

      <div class="hero__content">
        <h1 class="title">ENSO</h1>
        <p class="subtitle" data-i18n="hero_subtitle">OIL PAINTING ARTIST</p>
      </div>

      <img src="frog.png" alt="Жаба" class="artwork-frog">

      <!-- СКРОЛ-ІНДИКАТОР -->
      <div class="scroll-indicator">
        <div class="scroll-line"></div>
        <span>SCROLL</span>
      </div>
    </section>

    <!-- 2. ПРО МЕНЕ -->
    <section id="about" class="screen-section transparent-section">
      <div class="section-container">
        <h2 data-i18n="about_title">Про мене</h2>
        <p data-i18n="about_text">Короткий текст про твоє бачення мистецтва, стиль та ідеї.</p>
      </div>
    </section>

    <!-- 3. ПОРТФОЛІО -->
    <section id="works" class="screen-section portfolio-section">
      <div class="section-container">
        <h2 data-i18n="works_title">Портфоліо</h2>
        <p data-i18n="works_text">Галерея робіт або сітка картин.</p>
      </div>
    </section>

    <!-- 4. КОНТАКТИ -->
    <section id="contacts" class="screen-section transparent-section">
      <div class="section-container">
        <h2 data-i18n="contacts_title">Контакти</h2>
        <p data-i18n="contacts_text">Email, соцмережі або форма для зв'язку.</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
